<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проверка звёздного фона</title>
<!-- ============================================================
     Служебная страница. На сайте на неё нет ни одной ссылки.
     Нужна ровно для одного: открыть с проблемного устройства
     и увидеть, почему фон не показывается. Перед запуском
     боевого сайта файл можно просто удалить.
     ============================================================ -->
<style>
  :root{ --ink:#0D0B08; --brass:#C2A05C; --bone:#EAE3D6; --hairline:#2A2318 }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:1.25rem;-webkit-text-size-adjust:100%}
  h1{font-size:1.25rem;margin:0 0 .25rem;letter-spacing:-.02em}
  p.sub{margin:0 0 1.25rem;color:rgba(234,227,214,.62);font-size:.9375rem}
  /* Высота близка к экрану: сцена всё равно рисуется в размер окна,
     и в низкой полоске картинка выглядела бы сплющенной. */
  #stage{position:relative;height:60vh;border:1px solid var(--hairline);margin-bottom:1.25rem;overflow:hidden}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stage .veil{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none}
  #stage b{position:absolute;left:.75rem;bottom:.5rem;z-index:2;font-size:.75rem;
           letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
  table{width:100%;border-collapse:collapse;font-size:.9375rem}
  td{padding:.6rem .25rem;border-bottom:1px solid var(--hairline);vertical-align:top}
  td:first-child{color:rgba(234,227,214,.62);width:46%}
  td:last-child{font-weight:700;word-break:break-word}
  .ok{color:#7DBE7A} .no{color:#E0705F}
  footer{margin-top:1.5rem;font-size:.875rem;color:rgba(234,227,214,.62)}
</style>
</head>
<body>

<h1>Проверка звёздного фона</h1>
<p class="sub">Откройте эту страницу на том устройстве, где фона не видно,
и пришлите скриншот целиком.</p>

<div id="stage">
  <canvas id="scene"></canvas>
  <div class="veil"></div>
  <b>здесь должны быть звёзды</b>
</div>

<table id="out"></table>

<footer>Служебная страница, на сайте на неё нет ссылок.</footer>

<script>
const rows = [];
const add = (name, value, good) => {
  rows.push(`<tr><td>${name}</td><td class="${good === undefined ? "" : good ? "ok" : "no"}">${value}</td></tr>`);
  document.getElementById("out").innerHTML = rows.join("");
};

const conn = navigator.connection || {};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

add("Экран", `${innerWidth} × ${innerHeight}, плотность ${devicePixelRatio || 1}`);
add("Браузер", navigator.userAgent);
add("«Уменьшить движение»", reduced ? "включено — фон отключается" : "выключено", !reduced);
add("Экономия трафика", conn.saveData === true ? "включена — фон отключается" : "выключена", conn.saveData !== true);
add("Тип сети", conn.effectiveType || "неизвестен");
add("Памяти у устройства", navigator.deviceMemory ? navigator.deviceMemory + " ГБ" : "не сообщает");
add("Ядер процессора", navigator.hardwareConcurrency || "не сообщает");

/* WebGL сам по себе */
let gl = null;
try { gl = document.createElement("canvas").getContext("webgl") || document.createElement("canvas").getContext("experimental-webgl"); } catch (e) {}
add("WebGL", gl ? "есть" : "НЕТ — фон работать не может", !!gl);
if (gl) {
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  if (dbg) add("Видеоядро", gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
}

/* Файл сцены */
const t0 = performance.now();
fetch("js/scene.js", { cache: "no-store" })
  .then(r => r.ok ? r.blob() : Promise.reject(r.status))
  .then(b => add("Файл сцены js/scene.js", `загружен, ${Math.round(b.size / 1024)} КБ за ${Math.round(performance.now() - t0)} мс`, true))
  .catch(e => add("Файл сцены js/scene.js", "НЕ ЗАГРУЗИЛСЯ: " + e, false));

/* Запуск самой сцены */
addEventListener("error", e => add("Ошибка на странице", e.message, false));
if (reduced) {
  add("Запуск сцены", "пропущен: включено «уменьшить движение»");
} else {
  import("./js/scene.js").then(() => {
    add("Запуск сцены", "без ошибок", true);
    let n = 0;
    const s0 = performance.now();
    const tick = () => {
      n++;
      if (performance.now() - s0 < 5000) requestAnimationFrame(tick);
      else {
        const fps = n * 1000 / (performance.now() - s0);
        add("Кадров в секунду", fps.toFixed(1) + (fps < 20 ? " — устройство не тянет" : ""), fps >= 20);
        const c = document.getElementById("scene");
        add("Канва на месте", c && c.isConnected ? `да, ${c.width} × ${c.height}` : "убрана", !!(c && c.isConnected));
      }
    };
    requestAnimationFrame(tick);
  }).catch(e => add("Запуск сцены", "ОШИБКА: " + (e && e.message ? e.message : e), false));
}
</script>

</body>
</html>
